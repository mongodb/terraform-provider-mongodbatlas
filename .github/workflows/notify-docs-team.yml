name: Notify Docs team

# Notifies the Docs team when GitHub requests docs-cloud-team to review a PR.
# Whether Docs is requested is decided by .github/CODEOWNERS only: changelog
# entries, hand-written docs and doc templates are owned by docs-cloud-team,
# while autogenerated docs are reassigned to APIx-Integrations by the generated
# block maintained by tools/autogendocslist. Manual requests and re-requests of
# docs-cloud-team also notify. There is no draft guard: GitHub does not request
# code owners on draft PRs, so a request on a draft is a deliberate manual one,
# and marking the PR ready would not emit it again.
on:
  pull_request:
    types: [review_requested]

jobs:
  slack-notification:
    if: github.event.requested_team.slug == 'docs-cloud-team'
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Needed by sticky-pull-request-comment
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_DOCS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ github.event.repository.name }}: hey ${{ secrets.SLACK_DOCS_TAG }}, this is APIx bot, can you please review <${{ github.event.pull_request.html_url }}|PR ${{ github.event.pull_request.number }}>? thanks a lot!"
                  }
                }
              ]
            }
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-title-slack-doc
          append: true
          message: "APIx bot: a message has been sent to Docs Slack channel"
