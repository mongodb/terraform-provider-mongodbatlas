name: Notify Docs team

on:
  pull_request:
    types: [opened, ready_for_review]

jobs:
  check:
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-latest
    outputs:
      files: ${{ steps.changes.outputs.files }}
      new_autogen_docs: ${{ steps.changes.outputs.new_autogen_docs }}
      exclusions: ${{ steps.exclusions.outcome == 'success' && 'true' || 'false' }}
    permissions:
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e
        id: setup-go
        continue-on-error: true
        with:
          go-version-file: 'go.mod'
      # Autogenerated docs are excluded from the notification as they are not
      # reviewable by the Docs team; feedback for them belongs to the backend
      # side. The filter is generated by tools/autogendocslist based on
      # tools/codegen/config.yml.
      - name: Generate docs exclusions
        id: exclusions
        if: steps.setup-go.outcome == 'success'
        continue-on-error: true
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          git fetch origin "$BASE_SHA" --depth=1
          go run ./tools/autogendocslist -base-ref "$BASE_SHA" -filters docs-filters.yaml
      - name: Report exclusion fallback
        if: steps.exclusions.outcome != 'success'
        run: echo "::warning::Could not generate docs exclusions. All docs and changelog changes will notify the Docs team."
      - uses: dorny/paths-filter@ceb8a2b8f2d89434be7ff52d3de7ec3738c5cc9d
        id: changes
        with:
          filters: >-
            ${{ steps.exclusions.outcome == 'success' && 'docs-filters.yaml' || 'files: [".changelog/**", "docs/**"]' }}
          predicate-quantifier: 'some-with-excludes'
        
  slack-notification:
    needs: check
    # Newly autogenerated docs are excluded from the regular notification but
    # still get a one-time ping, so the docs team sees them when introduced.
    if: ${{ needs.check.outputs.files == 'true' || needs.check.outputs.new_autogen_docs == 'true' }}
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write # Needed by sticky-pull-request-comment
    steps:
      - uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_DOCS }}
          webhook-type: incoming-webhook
          payload: |
            {
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ github.event.repository.name }}: hey ${{ secrets.SLACK_DOCS_TAG }}, this is APIx bot, can you please review <${{ github.event.pull_request.html_url }}|PR ${{ github.event.pull_request.number }}>? thanks a lot!"
                  }
                }
              ]
            }
      - uses: marocchino/sticky-pull-request-comment@5770ad5eb8f42dd2c4f34da00c94c5381e49af88
        with:
          header: pr-title-slack-doc
          append: true
          # When exclusions could not be generated, say so in the sticky
          # comment: the ::warning:: annotation above is only visible in the
          # Actions run, and the PR author is the one who can fix it.
          message: >-
            APIx bot: a message has been sent to Docs Slack channel${{ needs.check.outputs.exclusions == 'true' && '.' || ', but docs exclusions could not be generated, so all docs and changelog changes were notified. Check the "Generate docs exclusions" step in the Notify Docs team workflow run.' }}
