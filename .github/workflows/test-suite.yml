name: 'Test Suite'

# Runs acceptance and migrations tests with a set of terraform versions and provider versions (used for migration tests).
# This workflow is scheduled daily with different authentication methods based on the day:
#   - Sunday: PAK against QA environment
#   - Monday, Wednesday, Friday: PAK against Dev environment
#   - Tuesday, Thursday, Saturday: SA against Dev environment
# Note: PAK refers to Programmatic API Key authentication (use_sa: false), SA refers to Service Account authentication (use_sa: true)
# It can also be run manually.
# Pending change in CLOUDP-353513: Once we enable terraform-compatibility-matrix.yml, we may want to skip the test-suite on those days (see schedule->cron below).
on:
  workflow_dispatch:
    inputs:
      terraform_matrix:
        description: 'Terraform version matrix (JSON array)'
        default: '["1.16.x","1.15.x","1.14.x","1.13.x","1.12.x","1.11.x","1.10.x"]'
      provider_matrix:
        description: 'Previous MongoDB Atlas Provider version matrix for migration tests (JSON array)'
        default: '[""]' # "" for latest version
      send_notification:
        description: 'Send a Slack notification to the streams team if stream tests fail.'
        type: boolean
        default: false
      trigger_test_summary:
        description: 'Generate an AI summary of the run and post it to Slack.'
        type: boolean
        default: false
      use_sa:
        description: "Run tests using Service Account instead of API Keys"
        type: boolean
        default: false
  workflow_call:
    inputs:
      terraform_matrix:
        description: 'Terraform version matrix (JSON array)'
        type: string
      provider_matrix:
        description: 'Previous MongoDB Atlas Provider version matrix for migration tests (JSON array)'
        type: string
        default: '[""]' # "" for latest version
      atlas_cloud_env:
        description: 'Atlas cloud environment used, can be either `dev` or `qa`, empty for `dev`'     
        type: string
        required: false
      send_notification:
        description: 'Send a Slack notification to the streams team if stream tests fail.'
        type: boolean
        default: false
      trigger_test_summary:
        description: 'Generate an AI summary of the run and post it to Slack.'
        type: boolean
        default: false
      use_sa:
        description: "Run tests using Service Account instead of API Keys"
        type: boolean
        default: false  
  schedule:
    - cron: "0 0 * * *" # workflow runs every day at midnight UTC

concurrency:
  group: '${{ github.workflow }}'
  cancel-in-progress: false
   
jobs:
  variables:
    permissions: {}
    env:
      schedule_terraform_matrix: '["1.16.x"]'
      schedule_provider_matrix: '[""]' # "" for latest version    
    runs-on: ubuntu-latest
    outputs:
      terraform_matrix: ${{ inputs.terraform_matrix || env.schedule_terraform_matrix }}
      provider_matrix: ${{ inputs.provider_matrix || env.schedule_provider_matrix }}
      is_sun: ${{ steps.set_day.outputs.DAY == 'Sun' }}
      use_sa: ${{ inputs.use_sa == true || (github.event_name == 'schedule' && (steps.set_day.outputs.DAY == 'Tue' || steps.set_day.outputs.DAY == 'Thu' || steps.set_day.outputs.DAY == 'Sat')) }}
      send_notification: ${{ github.event_name == 'schedule' || inputs.send_notification == true }}
      trigger_test_summary: ${{ github.event_name == 'schedule' || inputs.trigger_test_summary == true }}
    steps:
      - name: set day
        id: set_day
        run: |
          echo "DAY=$(date +'%a')"
          echo "DAY=$(date +'%a')" >> "$GITHUB_OUTPUT"
  clean-before:
    permissions: {}
    secrets: inherit
    uses: ./.github/workflows/cleanup-test-env.yml

  tests:
    needs: [clean-before, variables]
    if: ${{ !cancelled() }}
    permissions:
      id-token: write
      contents: read
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        terraform_version: ${{ fromJSON(needs.variables.outputs.terraform_matrix) }}
        provider_version: ${{ fromJSON(needs.variables.outputs.provider_matrix) }}
    name: ${{ matrix.terraform_version || 'latest' }}-${{ matrix.provider_version || 'latest' }}-${{ needs.variables.outputs.use_sa == 'true' && 'sa' || 'pak' }}
    secrets: inherit
    uses: ./.github/workflows/acceptance-tests.yml
    with:
      terraform_version: ${{ matrix.terraform_version }}
      provider_version: ${{ matrix.provider_version }}
      atlas_cloud_env: ${{ inputs.atlas_cloud_env || needs.variables.outputs.is_sun == 'true' && 'qa' || '' }} # Run against QA on Sundays
      # Job output variables are always returned as strings.
      use_sa: ${{ needs.variables.outputs.use_sa == 'true' }}
      send_notification: ${{ needs.variables.outputs.send_notification == 'true' }}

  clean-after:
    needs: tests
    if: ${{ !cancelled() }}
    permissions: {}
    secrets: inherit
    uses: ./.github/workflows/cleanup-test-env.yml

  trigger-test-summary:
    needs: [tests, variables, clean-after]
    if: ${{ !cancelled() && needs.variables.outputs.trigger_test_summary == 'true' }}
    runs-on: ubuntu-latest
    env:
      TEST_SUITE_EVIDENCE_NAME: test-suite-evidence-${{ github.run_id }}-${{ github.run_attempt }}
    permissions:
      actions: read
      contents: read
      id-token: write
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare test run evidence
        timeout-minutes: 10
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: python3 .agents/skills/summarize-test-suite/scripts/prepare.py "$RUN_ID" "$RUNNER_TEMP/$TEST_SUITE_EVIDENCE_NAME"
      - name: Summarize test run
        id: summary
        timeout-minutes: 15
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .agents/skills/summarize-test-suite/SKILL.md using the prepared evidence at ${{ runner.temp }}/${{ env.TEST_SUITE_EVIDENCE_NAME }}/run.json.
            Return the Slack mrkdwn text in the structured output's `summary` field.
          # Grep lets the agent expand evidence without shell or MCP tools.
          claude_args: >-
            --max-turns 35
            --add-dir "${{ runner.temp }}/${{ env.TEST_SUITE_EVIDENCE_NAME }}"
            --tools Read,Grep
            --allowedTools Read,Grep
            --disallowedTools "mcp__*" "Read(/.git/**)"
            --model "${{ vars.TEST_SUITE_SUMMARY_MODEL || 'claude-opus-5-5' }}"
            --effort "${{ vars.TEST_SUITE_SUMMARY_EFFORT || 'medium' }}"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string","minLength":1,"maxLength":2900,"pattern":"^\\s*:(red|yellow|green)_circle: [*]Test Suite #[0-9]+ — "}},"required":["summary"],"additionalProperties":false}'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.AI_GATEWAY_ANTHROPIC_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "api-key: ${{ secrets.AI_GATEWAY_API_KEY }}"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      - name: Persist summary to run page and file
        env:
          SUMMARY: ${{ fromJSON(steps.summary.outputs.structured_output).summary }}
          ONCALL_TAG: ${{ secrets.SLACK_ONCALL_TAG }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          jq -en --arg summary "$SUMMARY" --arg tag "$ONCALL_TAG" --arg run "$RUN_NUMBER" '
            ($summary | sub("^\\s+"; "")) as $body |
            ($body | capture("^:(?<color>red|yellow|green)_circle: [*]Test Suite #(?<run>[0-9]+) — (?<verdict>[^*\\n]+)[*]")) as $header |
            ($header.run == $run) and
            ({red: ["CODE REGRESSION DETECTED"],
              yellow: ["Infrastructure noise only", "Results incomplete"],
              green: ["All tests passed"]}[$header.color] | index($header.verdict) != null) and
            ($body | split("\n")[1] // "" | test("^(high|medium|low) confidence — ")) and
            ($summary | length) <= 2900 and
            ($tag + " " + $summary | length) <= 3000
          ' > /dev/null || { echo "::error::Invalid summary header, run number, confidence line, or Slack length"; exit 1; }
          printf '%s\n' "$SUMMARY" | tee summary.md >> "$GITHUB_STEP_SUMMARY"
      - name: Upload summary artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: summary
          path: summary.md
      - name: Post summary to Slack
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_TEST }} # TEMP (CLOUDP-424367): post to test channel; revert before merge.
          webhook-type: incoming-webhook
          errors: true
          payload: |
            {
              "text": "Test Suite #${{ github.run_number }} summary",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": ${{ toJSON(format('{0} {1}', secrets.SLACK_ONCALL_TAG, fromJSON(steps.summary.outputs.structured_output).summary)) }}
                  }
                }
              ]
            }
      - name: Fallback ping if any prior step failed
        if: ${{ failure() }}
        uses: slackapi/slack-github-action@dcb1066f776dd043e64d0e8ba94ca15cc7e1875d
        with:
          webhook: ${{ secrets.SLACK_WEBHOOK_URL_TEST }} # TEMP (CLOUDP-424367): post to test channel; revert before merge.
          webhook-type: incoming-webhook
          payload: |
            {
              "text": "Test Suite #${{ github.run_number }} AI summary unavailable",
              "blocks": [
                {
                  "type": "section",
                  "text": {
                    "type": "mrkdwn",
                    "text": "${{ secrets.SLACK_ONCALL_TAG }} :red_circle: Test Suite #${{ github.run_number }} — AI summary unavailable, check the run manually: <${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}|view run>."
                  }
                }
              ]
            }
