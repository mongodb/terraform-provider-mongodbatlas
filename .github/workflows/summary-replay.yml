name: 'Summary Replay (TEMP CLOUDP-424367)'

# TEMP (CLOUDP-424367): replay the summarize skill against historical Test Suite runs
# without re-running acceptance tests, so the new summaries can be compared with the
# originals. Remove before merge.
#
# Triggered on a change to this file (push uses the branch's version) because a
# workflow_dispatch run requires the workflow to exist on the default branch.
on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/summary-replay.yml'

jobs:
  replay:
    runs-on: ubuntu-latest
    permissions:
      actions: read
      contents: read
      id-token: write
    strategy:
      fail-fast: false
      matrix:
        # Last 4 daily Test Suite runs on master.
        run_id: [37866210452, 37709100890, 37553383581, 37395290269]
    env:
      EVIDENCE: replay-evidence-${{ matrix.run_id }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - name: Prepare evidence
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python3 .agents/skills/summarize-test-suite/scripts/prepare.py "${{ matrix.run_id }}" "$RUNNER_TEMP/$EVIDENCE"
      - name: Summarize
        id: summary
        timeout-minutes: 15
        uses: anthropics/claude-code-action@97c53473391bff1901034d4b454b5bac7ab7a029
        with:
          anthropic_api_key: ${{ secrets.AI_GATEWAY_API_KEY }}
          github_token: ${{ secrets.GITHUB_TOKEN }}
          prompt: |
            Follow .agents/skills/summarize-test-suite/SKILL.md using the prepared evidence at ${{ runner.temp }}/${{ env.EVIDENCE }}/run.json.
            Return the Slack mrkdwn text in the structured output's `summary` field.
          claude_args: >-
            --max-turns 35
            --add-dir "${{ runner.temp }}/${{ env.EVIDENCE }}"
            --tools Read,Grep
            --allowedTools Read,Grep
            --disallowedTools "mcp__*" "Read(/.git/**)"
            --model "${{ vars.TEST_SUITE_SUMMARY_MODEL || 'claude-opus-5-5' }}"
            --effort "${{ vars.TEST_SUITE_SUMMARY_EFFORT || 'medium' }}"
            --json-schema '{"type":"object","properties":{"summary":{"type":"string","minLength":1,"maxLength":2900,"pattern":"^\\s*:(red|yellow|green)_circle: [*]Test Suite #[0-9]+ — "}},"required":["summary"],"additionalProperties":false}'
        env:
          ANTHROPIC_BASE_URL: ${{ secrets.AI_GATEWAY_ANTHROPIC_URL }}
          ANTHROPIC_CUSTOM_HEADERS: "api-key: ${{ secrets.AI_GATEWAY_API_KEY }}"
          CLAUDE_CODE_DISABLE_EXPERIMENTAL_BETAS: "1"
      - name: Save new summary
        env:
          SUMMARY: ${{ fromJSON(steps.summary.outputs.structured_output).summary }}
        run: |
          printf '%s\n' "$SUMMARY" > "new-${{ matrix.run_id }}.md"
          printf '%s\n' "$SUMMARY" > "$GITHUB_STEP_SUMMARY"
      - name: Fetch original summary
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh run download "${{ matrix.run_id }}" -n summary -D "orig-${{ matrix.run_id }}"
      - name: Append original summary
        continue-on-error: true
        run: |
          {
            echo ""
            echo "## Original summary"
            echo '```'
            cat "orig-${{ matrix.run_id }}"/summary.md
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a
        with:
          name: replay-${{ matrix.run_id }}
          path: |
            new-${{ matrix.run_id }}.md
            orig-${{ matrix.run_id }}/**
          if-no-files-found: warn
