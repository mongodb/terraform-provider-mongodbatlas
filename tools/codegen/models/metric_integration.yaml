        path: /api/atlas/v2/groups/{projectId}/metricIntegrations
    read:
        http_method: GET
        path: /api/atlas/v2/groups/{projectId}/metricIntegrations/{metricIntegrationId}
    update:
        http_method: PUT
        path: /api/atlas/v2/groups/{projectId}/metricIntegrations/{metricIntegrationId}
