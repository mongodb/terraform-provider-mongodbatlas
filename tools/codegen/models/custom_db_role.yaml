                                  tf_model_name: DatabaseName
                                  api_name: db
                                  req_body_usage: all_request_bodies
                                  sensitive: false
                                  create_only: false
                                  present_in_any_response: true
                                  request_only_required_on_create: false
                      description: List of resources on which you grant the action.
                      custom_type:
                        name: ActionsResources
                        model: customtypes.NestedSetValue[TFActionsResourcesModel]
