                      api_name: resources
                      req_body_usage: all_request_bodies
                      sensitive: false
                      create_only: false
                      present_in_any_response: true
                      request_only_required_on_create: false
          description: List of the individual privilege actions that the role grants.
          custom_type:
            name: Actions
            model: customtypes.NestedSetValue[TFActionsModel]
            schema: customtypes.NewNestedSetType[TFActionsModel](ctx)
            packages:
                - customtypes
          computed_optional_required: optional
          tf_schema_name: actions
          tf_model_name: Actions
          api_name: actions
          req_body_usage: send_null_as_empty_on_update
          sensitive: false
          create_only: false
          present_in_any_response: true
          request_only_required_on_create: false
        - string: {}
          description: Unique 24-hexadecimal digit string that identifies your project, also known as `groupId` in the official documentation.
          computed_optional_required: required
          tf_schema_name: project_id
          tf_model_name: ProjectId
          api_name: groupId
          req_body_usage: omit_always
          sensitive: false
          create_only: true
          present_in_any_response: false
          request_only_required_on_create: false
        - set_nested:
            nested_object:
                attributes:
                    - string: {}
                      description: Human-readable label that identifies the database on which someone grants the action to one MongoDB user.
                      computed_optional_required: required
                      tf_schema_name: database_name
                      tf_model_name: DatabaseName
                      api_name: db
                      req_body_usage: all_request_bodies
                      sensitive: false
                      create_only: false
                      present_in_any_response: true
                      request_only_required_on_create: false
                    - string: {}
                      description: Human-readable label that identifies the role inherited. Set this value to `admin` for every role except `read` or `readWrite`.
                      computed_optional_required: required
                      tf_schema_name: role_name
                      tf_model_name: RoleName
                      api_name: role
                      req_body_usage: all_request_bodies
                      sensitive: false
                      create_only: false
                      present_in_any_response: true
                      request_only_required_on_create: false
          description: List of the built-in roles that this custom role inherits.
          custom_type:
            name: InheritedRoles
            model: customtypes.NestedSetValue[TFInheritedRolesModel]
            schema: customtypes.NewNestedSetType[TFInheritedRolesModel](ctx)
            packages:
                - customtypes
          computed_optional_required: optional
          tf_schema_name: inherited_roles
          tf_model_name: InheritedRoles
          api_name: inheritedRoles
          req_body_usage: send_null_as_empty_on_update
          sensitive: false
          create_only: false
          present_in_any_response: true
          request_only_required_on_create: false
        - string: {}
          description: Human-readable label that identifies the role for the request. This name must be unique for this custom role in this project.
          computed_optional_required: required
          tf_schema_name: role_name
          tf_model_name: RoleName
          api_name: roleName
          req_body_usage: omit_in_update_body
          sensitive: false
          create_only: true
          present_in_any_response: true
          request_only_required_on_create: false
    expanded_model: true
