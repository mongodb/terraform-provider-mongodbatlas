                      tf_schema_name: last_used_at
                      tf_model_name: LastUsedAt
                      api_name: lastUsedAt
                      req_body_usage: omit_always
                      sensitive: false
                      create_only: false
                      present_in_any_response: true
                      request_only_required_on_create: false
                    - int64: {}
                      description: The number of requests that has originated from this network address.
                      computed_optional_required: computed
                      tf_schema_name: request_count
                      tf_model_name: RequestCount
                      api_name: requestCount
                      req_body_usage: omit_always
                      sensitive: false
                      create_only: false
                      present_in_any_response: true
                      request_only_required_on_create: false
          description: List of IP access list entries that define allowed source addresses for this MCP configuration.
          custom_type:
            name: IpAccessList
            model: customtypes.NestedListValue[TFIpAccessListModel]
            schema: customtypes.NewNestedListType[TFIpAccessListModel](ctx)
            packages:
                - customtypes
