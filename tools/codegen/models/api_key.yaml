schema:
    description: Creates one API key for the specified organization. An organization API key grants programmatic access to an organization. You can't use the API key to log into the console.
    attributes:
        - string: {}
          description: Purpose or explanation provided when someone created this organization API key.
          computed_optional_required: required
          tf_schema_name: description
          tf_model_name: Description
          api_name: desc
          req_body_usage: all_request_bodies
          sensitive: false
          create_only: false
          present_in_any_response: true
          request_only_required_on_create: false
        - string: {}
          description: Unique 24-hexadecimal digit string that identifies this organization API key assigned to this project.
          computed_optional_required: computed
          tf_schema_name: api_key_id
          tf_model_name: ApiKeyId
          api_name: id
          req_body_usage: omit_always
          sensitive: false
          create_only: false
          present_in_any_response: true
          request_only_required_on_create: false
          immutable_computed: true
        - string: {}
          description: Unique 24-hexadecimal digit string that identifies the organization that contains your projects.
          computed_optional_required: required
          tf_schema_name: org_id
          tf_model_name: OrgId
          api_name: orgId
          req_body_usage: omit_always
          sensitive: false
          create_only: true
          present_in_any_response: false
          request_only_required_on_create: false
        - string: {}
          description: Redacted private key returned for this organization API key. This key displays unredacted when first created.
          computed_optional_required: computed
          tf_schema_name: private_key
          tf_model_name: PrivateKey
          api_name: privateKey
          req_body_usage: omit_always
